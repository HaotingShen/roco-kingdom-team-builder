services:
  backend:
    image: ${ECR_URI}:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - LLM_PROVIDER=deepseek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # DeepSeek-V4 migration (legacy deepseek-reasoner retires 2026-07-24 15:59 UTC).
      # This env is the rollback lever: set DEEPSEEK_MODEL=deepseek-reasoner to revert (works until that date).
      - DEEPSEEK_MODEL=deepseek-v4-flash
      - DEEPSEEK_THINKING_ENABLED=true
      - DEEPSEEK_REASONING_EFFORT=high
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Cookie settings for path-based routing (same domain for frontend + API)
      # COOKIE_DOMAIN not set = defaults to exact origin (rkteambuilder.com), correct for same-site
      - COOKIE_SAMESITE=none
      - COOKIE_SECURE=true
      - FRONTEND_URL=${FRONTEND_URL}  # CRITICAL: Used for email links, must be public URL
      - ALLOWED_ORIGINS=${FRONTEND_URL},https://3rd-tool-h5-al.tapimg.com
      - RATE_LIMIT_ENABLED=true
      - ANALYSIS_RATE_LIMIT=1/2minutes
      # NOTE: Backend rate limiter MUST extract client IP from CloudFront-Viewer-Address header
      # (not from REMOTE_ADDR which will be CloudFront's IP). See backend/rate_limiter.py.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=noreply@rkteambuilder.com
      - SMTP_FROM_NAME=RK Team Builder
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      # DB connection pool: 2 workers × (5 + 5) = 20 max connections.
      # Postgres runs on this box (max_connections=50) — each backend costs ~10 MB RSS,
      # so the old 60-connection ceiling would have been ~600 MB on a 2 GB instance.
      # Safe to shrink: the analysis path closes its session before the LLM calls
      # (backend/analysis/service.py), so connections are not held during the slow phase.
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
      # Memory: limit glibc arenas to reduce fragmentation from large DeepSeek responses
      - MALLOC_ARENA_MAX=2
    mem_limit: 2500m
    memswap_limit: 2500m
    volumes:
      - /home/ubuntu/rktb/logs:/app/backend/logs
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-1
        awslogs-group: /rktb/backend
        awslogs-stream: backend
        awslogs-create-group: "true"
    depends_on:
      redis:
        condition: service_healthy
      # NOTE: no depends_on for postgres yet. Until DATABASE_URL is repointed at the
      # container (Phase 4 cutover), the backend does not use it, and a hard
      # service_healthy dependency would let a postgres failure take the API down for
      # no reason. This is added at cutover, when it becomes true.

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --save 900 1
      --save 300 10
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    restart: always
    ports:
      # loopback only — never exposed off-box
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=roco_kingdom
      - POSTGRES_USER=rktb_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # MUST match the RDS source collation (en_US.UTF-8). Use the Debian (glibc)
      # image -- NOT postgres:16-alpine. Verified 2026-08-20 on this box:
      #   alpine/musl : 'Apricot | Banana | apple | banana | cherry'  (byte order)
      #   debian/glibc: 'apple | Apricot | banana | Banana | cherry'  (= RDS)
      # Both images REPORT datcollate='en_US.UTF-8', so checking that label proves
      # nothing -- musl accepts the locale name and ignores it. Alpine would have
      # silently reordered every name-sorted list (monsters, moves, teams).
      - POSTGRES_INITDB_ARGS=--locale=en_US.UTF-8
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rktb_admin -d roco_kingdom"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  pgdata: