# RKTB log rotation — install to /etc/logrotate.d/rktb
# docker_stats.log grows ~4 MB/day (5s intervals × 3 containers)
# Keeps 7 days compressed. copytruncate is required because the @reboot
# background process has the file open for continuous writing.

/home/ubuntu/rktb/docker_stats.log {
    su ubuntu ubuntu
    daily
    rotate 7
    compress
    missingok
    notifempty
    copytruncate
}

/home/ubuntu/rktb/logs/monitor.log {
    su ubuntu ubuntu
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}

/home/ubuntu/rktb/logs/restart.log {
    su ubuntu ubuntu
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}
